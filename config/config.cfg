[logging]
# Logging categories
# Available categories: vector.store, embedding.model, embedding.encode, embedding.store, processor, db.store
# vector.store: Logs related to vector storage operations.
# embedding.model: Logs related to embedding model operations.
# embedding.encode: Logs related to the embedding encoding process.
# embedding.store: Logs related to embedding storage operations.
# processor: Logs related to the processing of data and operations.
# db.store: Logs related to PostgreSQL storage operations.
categories = processor, vector.store, db.store

[hf]
# Hugging Face API token for authentication and access to Hugging Face services.
token = your_hugging_face_api_token_here

[database]
# PostgreSQL connection for storing chunks and embeddings
# Either set url or individual connection parameters
# url = postgresql://user:password@localhost:5432/docchatbot
host = localhost
port = 5432
name = docchatbot
user = docuser
# password = your_password_here